name: Aggregate Changelog

# Pulls CHANGELOG.yml from every Audiaptic repo and writes one Docusaurus blog
# post per day. Reads the sibling repos over public HTTPS, so it needs no
# tokens beyond write access to this repo.

on:
  schedule:
    - cron: '0 */6 * * *'   # every 6 hours
  workflow_dispatch:         # plus a "Run workflow" button for when you want it now

concurrency:
  group: aggregate-changelog
  cancel-in-progress: true

env:
  # Must match BLOG_DIR in .github/scripts/aggregate_changelog.py
  BLOG_DIR: blog

jobs:
  aggregate:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Check out docs
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install pyyaml

      - name: Rebuild and push changelog posts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          for attempt in 1 2 3; do
            git fetch origin "$GITHUB_REF_NAME"
            git reset --hard "origin/$GITHUB_REF_NAME"

            python .github/scripts/aggregate_changelog.py

            git add "$BLOG_DIR"

            if git diff --cached --quiet; then
              echo "Changelog posts are already up to date."
              exit 0
            fi

            git commit -m "Update changelog"

            if git push; then
              exit 0
            fi

            echo "Push rejected (attempt $attempt) - resyncing and regenerating."
            sleep 5
          done

          echo "Could not push after 3 attempts."
          exit 1