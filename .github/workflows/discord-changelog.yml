name: Discord Changelog

# Pulls the day's changelog post from the docs repo and sends it to the Discord webhook. 
# Ex: blog/2026-09-17-changelog.mdx -> https://discord.com/api/webhooks/...
# Uses tsickert/discord-webhook@v7.0.0

on:
  schedule:
    - cron: '0 0 * * *'   # every day at midnight
  workflow_dispatch:     # plus a "Run workflow" button for when you want it now

concurrency:
  group: discord-changelog
  cancel-in-progress: true

env:
  # Must match BLOG_DIR in .github/scripts/aggregate_changelog.py
  BLOG_DIR: blog
  DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}

jobs:
  discord:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Check out docs
        uses: actions/checkout@v4

      # - name: Set up Python
      #   uses: actions/setup-python@v5
      #   with:
      #     python-version: '3.12'
      
      # - name: Install dependencies
      #   run: pip install pyyaml
      - name: Get changelog content
        id: get_changelog
        run: |
          YESTERDAY=$(date -d "yesterday" +%Y-%m-%d)
          BLOG_FILE="blog/${YESTERDAY}-changelog.mdx"

          if [ ! -f "$BLOG_FILE" ]; then
            echo "No changelog post for ${YESTERDAY}."
            echo "found=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "found=true" >> "$GITHUB_OUTPUT"

          CONTENT=$(sed '1,/^---$/d' "$BLOG_FILE" \
            | sed '/truncate/d' \
            | sed 's/&#123;/{/g; s/&lt;/</g')

          {
            echo "content<<CHANGELOG_EOF"
            echo "$CONTENT"
            echo "CHANGELOG_EOF"
          } >> "$GITHUB_OUTPUT"
      # Send the changelog to Discord for previous day. If the changelog post for the day doesn't exist, send a message saying so.
      - name: Send changelog to Discord
        uses: tsickert/discord-webhook@v7.0.0
        with:
          webhook-url: ${{ env.DISCORD_WEBHOOK_URL }}
          username: Audiaptic Changelog
          content: |
            ${{ steps.get_changelog.outputs.content }}
        if: steps.get_changelog.outputs.found == 'true'
